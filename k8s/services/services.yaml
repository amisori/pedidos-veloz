apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  namespace: pedidos-veloz
  labels:
    app: api-gateway
spec:
  # LoadBalancer expõe o gateway externamente (único ponto de entrada)
  # Em minikube: use NodePort. Em cloud: LoadBalancer provisionará um IP externo.
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: pedidos-svc
  namespace: pedidos-veloz
  labels:
    app: pedidos
spec:
  # ClusterIP: acessível apenas dentro do cluster (sem exposição externa)
  type: ClusterIP
  selector:
    app: pedidos
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: pagamentos-svc
  namespace: pedidos-veloz
  labels:
    app: pagamentos
spec:
  type: ClusterIP
  selector:
    app: pagamentos
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: estoque-svc
  namespace: pedidos-veloz
  labels:
    app: estoque
spec:
  type: ClusterIP
  selector:
    app: estoque
  ports:
    - name: http
      port: 8002
      targetPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: pedidos-veloz
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-svc
  namespace: pedidos-veloz
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
