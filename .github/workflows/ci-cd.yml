name: CI/CD — Pedidos Veloz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/pedidos-veloz

jobs:
  # ============================================================
  # JOB 1: Lint — valida estilo e qualidade do código
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint
          restore-keys: ${{ runner.os }}-pip-

      - name: Instala Ruff (linter rápido)
        run: pip install ruff

      - name: Ruff lint — api-gateway
        run: ruff check services/api-gateway/

      - name: Ruff lint — pedidos
        run: ruff check services/pedidos/

      - name: Ruff lint — pagamentos
        run: ruff check services/pagamentos/

      - name: Ruff lint — estoque
        run: ruff check services/estoque/

  # ============================================================
  # JOB 2: Testes automatizados
  # ============================================================
  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pedidos_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Instala dependências de todos os serviços
        run: |
          pip install pytest pytest-asyncio httpx
          pip install -r services/pedidos/requirements.txt
          pip install -r services/pagamentos/requirements.txt
          pip install -r services/estoque/requirements.txt
          pip install -r services/api-gateway/requirements.txt

      - name: Executa testes
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pedidos_db_test
        run: pytest tests/ -v --tb=short

  # ============================================================
  # JOB 3: Build e Push das imagens Docker
  # Executa apenas em push na main (não em PRs)
  # ============================================================
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        service:
          - name: api-gateway
            context: ./services/api-gateway
          - name: pedidos
            context: ./services/pedidos
          - name: pagamentos
            context: ./services/pagamentos
          - name: estoque
            context: ./services/estoque

    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # Token, nunca a senha direta

      - name: Extrai metadata (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-          # Tag com hash do commit (rastreabilidade)
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Setup Docker Buildx (multi-platform)
        uses: docker/setup-buildx-action@v3

      - name: Build e Push — ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha                   # Cache entre runs para build mais rápido
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 4: Deploy (conceitual — aplica manifests no cluster)
  # Em produção: requer KUBECONFIG configurado como secret
  # ============================================================
  deploy:
    name: Deploy para Produção
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production   # Requer aprovação manual no GitHub (gate de deploy)

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Configura kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Cria namespace (idempotente)
        run: kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Namespace
          metadata:
            name: pedidos-veloz
          EOF

      - name: Aplica ConfigMaps e Secrets
        run: |
          kubectl apply -f k8s/configmaps/
          kubectl apply -f k8s/secrets/

      - name: Atualiza imagem com SHA do commit (rastreabilidade)
        env:
          SHA: ${{ github.sha }}
        run: |
          IMAGE_TAG="sha-${SHA::7}"
          for SERVICE in api-gateway pedidos pagamentos estoque; do
            kubectl set image deployment/${SERVICE}-deployment \
              ${SERVICE}=${{ env.IMAGE_PREFIX }}-${SERVICE}:${IMAGE_TAG} \
              -n pedidos-veloz
          done

      - name: Aplica HPAs
        run: kubectl apply -f k8s/hpa/

      - name: Aguarda rollout concluir (Rolling Update)
        run: |
          for DEPLOYMENT in api-gateway-deployment pedidos-deployment pagamentos-deployment estoque-deployment; do
            kubectl rollout status deployment/${DEPLOYMENT} -n pedidos-veloz --timeout=180s
          done

      - name: Verifica pods em execução
        run: kubectl get pods -n pedidos-veloz
