name: CI/CD — Pedidos Veloz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/pedidos-veloz

jobs:
  # ============================================================
  # JOB 1: Lint
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint
          restore-keys: ${{ runner.os }}-pip-

      - name: Instala Ruff
        run: pip install ruff

      - name: Ruff lint — todos os serviços
        run: |
          ruff check services/api-gateway/ --ignore E501
          ruff check services/pedidos/ --ignore E501
          ruff check services/pagamentos/ --ignore E501
          ruff check services/estoque/ --ignore E501

  # ============================================================
  # JOB 2: Testes
  # ============================================================
  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pedidos_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Instala dependências
        run: |
          pip install pytest pytest-asyncio httpx
          pip install -r services/pedidos/requirements.txt
          pip install -r services/pagamentos/requirements.txt
          pip install -r services/estoque/requirements.txt
          pip install -r services/api-gateway/requirements.txt

      - name: Executa testes
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pedidos_db_test
        run: pytest tests/ -v --tb=short

  # ============================================================
  # JOB 3: Build e Push
  # ============================================================
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        service:
          - name: api-gateway
            context: ./services/api-gateway
          - name: pedidos
            context: ./services/pedidos
          - name: pagamentos
            context: ./services/pagamentos
          - name: estoque
            context: ./services/estoque

    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extrai metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push — ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 4: Deploy (requer KUBECONFIG configurado)
  # ============================================================
  deploy:
    name: Deploy para Producao
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Configura kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Cria namespace
        run: kubectl create namespace pedidos-veloz --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplica ConfigMaps e Secrets
        run: |
          kubectl apply -f k8s/configmaps/
          kubectl apply -f k8s/secrets/

      - name: Atualiza imagem com SHA do commit
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          for SERVICE in api-gateway pedidos pagamentos estoque; do
            kubectl set image deployment/${SERVICE}-deployment \
              ${SERVICE}=${{ env.IMAGE_PREFIX }}-${SERVICE}:${IMAGE_TAG} \
              -n pedidos-veloz
          done

      - name: Aplica HPAs
        run: kubectl apply -f k8s/hpa/

      - name: Aguarda rollout
        run: |
          for DEP in api-gateway-deployment pedidos-deployment pagamentos-deployment estoque-deployment; do
            kubectl rollout status deployment/${DEP} -n pedidos-veloz --timeout=180s
          done

      - name: Verifica pods
        run: kubectl get pods -n pedidos-veloz
